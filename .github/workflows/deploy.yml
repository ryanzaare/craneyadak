# .github/workflows/deploy.yml
# ---------------------------------------------------------------------------
# build سایت (Astro) و آپلود dist/ به cPanel از راه FTPS. ایست ۲ فاز ۶.
#
# اجرا می‌شود با:
#   • دکمه‌ی دستی (Actions ← Deploy ← Run workflow)
#   • repository_dispatch با event_type = wp-content-changed (وردپرس پس از انتشار محتوا)
#   • زمان‌بندی روزانه (پشتیبان: قیمت‌های در حال انقضا و محتوای تغییرکرده بدون وبهوک)
# عمداً روی push اجرا نمی‌شود: هر push نباید سایت زنده را عوض کند.
#
# ⚠️ Secrets لازم (Settings ← Secrets and variables ← Actions): راهنمای گام‌به‌گام در
# docs/deployment-guide.md «انتشار خودکار با GitHub Actions».
#   WP_GRAPHQL_URL, PUBLIC_WP_API_URL, FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, FTP_SERVER_DIR
# Variables (اختیاری): FTP_PROTOCOL (ftps | ftp؛ پیش‌فرض ftps)، INDEX_EMPTY_CATEGORIES (1 = دسته‌های
# بدون محصول هم ایندکس‌پذیر شوند؛ فقط پس از نهایی‌شدن محتوا — نگاه کنید به CLAUDE.md).
# ---------------------------------------------------------------------------
name: Deploy

on:
  workflow_dispatch:
    inputs:
      allow_shrink:
        description: 'حذف عمدی صفحه‌ها (ALLOW_SHRINK=1) — فقط وقتی ریزش صفحه‌ها عمدی است'
        type: boolean
        default: false
      allow_unlabeled:
        description: 'اضطراری: محصول بدون برچسب اصلی/غیر اصلی هم منتشر شود'
        type: boolean
        default: false
  repository_dispatch:
    types: [wp-content-changed]
  schedule:
    - cron: '30 2 * * *' # 02:30 UTC ≈ 06:00 تهران

# یک انتشار در هر لحظه؛ انتشار تازه‌تر جایگزین صف می‌شود، ولی انتشار در حال آپلود قطع نمی‌شود.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # npm run build شامل check:plugin است و به php نیاز دارد.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      # پایه‌ی «ریزش بی‌صدای صفحه‌ها» (check-build-audit) بین اجراها: فقط پس از اجرای موفق ذخیره می‌شود.
      - uses: actions/cache@v4
        with:
          path: .astro/build-manifest.json
          key: build-manifest-${{ github.run_id }}
          restore-keys: build-manifest-

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          WP_GRAPHQL_URL: ${{ secrets.WP_GRAPHQL_URL }}
          PUBLIC_WP_API_URL: ${{ secrets.PUBLIC_WP_API_URL }}
          INDEX_EMPTY_CATEGORIES: ${{ vars.INDEX_EMPTY_CATEGORIES }}
          ALLOW_SHRINK: ${{ inputs.allow_shrink && '1' || '' }}
          ALLOW_UNLABELED_AUTHENTICITY: ${{ inputs.allow_unlabeled && '1' || '' }}

      # dist/ شامل فایل مخفی .htaccess است (۳۰۱ واقعی، HTTPS، ۴۰۴) — باید آپلود شود.
      - name: Upload dist/ to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          dangerous-clean-slate: false

      # رفتار واقعی سرور (۳۰۱، HTTPS، ۴۰۴، فایل‌های داخلی بسته) — نه فقط «آپلود شد».
      - name: Verify live behaviour
        run: node scripts/verify-deploy.mjs
